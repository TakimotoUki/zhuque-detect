name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: node src/selftest.mjs
      - run: node tests/security.test.mjs
      - run: node tests/site.test.mjs
      - run: node tests/platform.test.mjs
      - run: node src/webcheck.mjs
      - run: node scripts/check-release.mjs
      - run: node scripts/pack.mjs
      - run: node scripts/check-release.mjs dist/zhuque-detect-mac
      - run: node scripts/check-release.mjs dist/zhuque-detect-win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.node }}
          path: dist/
          if-no-files-found: ignore
