name: Bug report / 问题报告
description: 提交可复现的问题；不要填写真实 Key 或私人文章。
body:
  - type: markdown
    attributes:
      value: 请移除 API Key、服务令牌、配置备份、个人路径和私人原文。安全问题参见 SECURITY.md。
  - type: input
    id: platform
    attributes:
      label: 系统、Node 版本与程序版本
      placeholder: Windows 11 / Node 22 / zhuque-detect 1.3.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期和实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的错误或诊断
